name: Claude Code Review

on:
  pull_request:
    # PR 作成時のみ自動レビューする。push ごとの再レビュー(synchronize)は行わず、
    # 指摘対応後の再レビューは PR 上の @claude メンションで明示的に依頼する。
    types: [opened, ready_for_review]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # コメント投稿には write が必要（read だとレビューしても投稿できず沈黙する）
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # git diff / git log で base ブランチとの差分・履歴を辿れるよう全履歴を取得する
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # サマリコメントを 1 つに集約し、push のたびに同じコメントを更新する
          use_sticky_comment: true
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR を包括的にレビューしてください。観点:
            1. バグ・ロジックエラー(境界条件、エラーハンドリング含む)
            2. 物理計算・数値計算の妥当性(S4/RCWA 部分は特に丁寧に)
            3. フロントエンドとバックエンドの API 整合性
            4. パフォーマンス(不要な再計算、再レンダリング)
            5. 可読性・保守性(重複、命名、設計)

            ルール:
            - 指摘は必ず mcp__github_inline_comment__create_inline_comment で
              該当行への inline comment として投稿する(重要度 [critical/major/minor/nit] を冒頭に明記)
            - 良い点も 1〜2 個、具体的な行を挙げて褒める
            - 最後に日本語で総評をトップレベルコメントとして投稿する
            - 指摘ゼロの場合も、確認した観点を添えて「指摘なし」と投稿する
            - コメントはすべて日本語で書く
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
