name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend (ruff / pyright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # S4 は vendor/S4 からビルドする C++ 拡張で、Linux では openblas を要求し
      # ビルドも重い。dependencies.py が S4 の import を関数内に閉じ込めているため、
      # solver グループを除いても lint と型チェックは完走する。
      #
      # 注意: uv run は既定で「既定グループでの再同期」を行うため、素の uv run では
      # ここで S4 がビルドされてしまう。各コマンドにも --no-group solver が必要。
      - name: Install dependencies (S4 を除く)
        run: uv sync --no-group solver

      - name: ruff check
        run: uv run --no-group solver ruff check src

      - name: ruff format --check
        run: uv run --no-group solver ruff format --check src

      - name: pyright
        run: uv run --no-group solver pyright

  frontend:
    name: frontend (eslint / tsc / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: next build
        run: npm run build
