name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend (ruff / pyright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # S4 は vendor/S4 からビルドする C++ 拡張で、Linux では openblas を要求し
      # ビルドも重い。dependencies.py が S4 の import を関数内に閉じ込めているため、
      # solver グループを除いても lint と型チェックは完走する。
      #
      # 注意: uv run は既定で「既定グループでの再同期」を行うため、素の uv run では
      # ここで S4 がビルドされてしまう。各コマンドにも --no-group solver が必要。
      - name: Install dependencies (S4 を除く)
        run: uv sync --no-group solver

      - name: ruff check
        run: uv run --no-group solver ruff check src

      - name: ruff format --check
        run: uv run --no-group solver ruff format --check src

      - name: pyright
        run: uv run --no-group solver pyright

      - name: lint-imports (層の依存方向)
        run: uv run --no-group solver lint-imports

      # CI では S4 をビルドしないので、S4 を使うテストは自動でスキップされる。
      - name: pytest
        run: uv run --no-group solver pytest

  frontend:
    name: frontend (eslint / tsc / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: next build
        run: npm run build
        env:
          # ビルドが通るかだけを見るので、実在しない値でよい
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy

  api-contract:
    name: api-contract (openapi.json / schema.d.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: openapi.json を再生成
        working-directory: backend
        run: |
          uv sync --no-group solver
          uv run --no-group solver python scripts/export_openapi.py

      - name: frontend の型を再生成
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api

      # API を変えたのに再生成をコミットし忘れると、ここで差分が出て落ちる。
      - name: 生成物がコミット済みと一致するか
        run: |
          git diff --exit-code -- openapi.json frontend/lib/api/schema.d.ts || {
            echo "::error::API の生成物が古い。backend で 'uv run --no-group solver python scripts/export_openapi.py'、frontend で 'npm run gen:api' を実行してコミットする"
            exit 1
          }
