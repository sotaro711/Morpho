# Cloud Run サービス morpho の設定。main へのマージで cloudbuild.yaml が
# image を今回のコミットのイメージに置き換えてから `gcloud run services replace` で反映する。
# コンソールで変えた設定は次のデプロイで上書きされるので、変更はこのファイルで行う。
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: morpho
  annotations:
    run.googleapis.com/ingress: all
    # アプリ側で Supabase の JWT を検証するので、Cloud Run の IAM 認証は使わない
    run.googleapis.com/invoker-iam-disabled: "true"
    # サービス単位の上限は全リビジョンの合計にかかるので、リビジョン単位の maxScale（20）より
    # こちらが実効上限になる。値は移行時点の本番設定をそのまま写している。
    run.googleapis.com/maxScale: "2"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "20"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/sessionAffinity: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      # 3 次元構造の計算（角柱の段差、基底 49）は 1 リクエストで数百秒かかるので、
      # 既定の 300 秒では打ち切られる（2026-10-27 に本番で 504）。非同期ジョブ化までの間は
      # 長めに取る
      timeoutSeconds: 1800
      serviceAccountName: 393004586204-compute@developer.gserviceaccount.com
      containers:
        - name: placeholder-1
          image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: morpho-sim
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: SUPABASE_URL
                  key: latest
          resources:
            limits:
              # 1 vCPU では 3 次元構造の計算が手元の数倍かかりタイムアウトしたので 2 vCPU にする
              cpu: 2000m
              memory: 1Gi
          # 起動時の確認（S4 など）は _lifespan で行い、失敗すればプロセスが終了するので、
          # ポートが開いたかを見る TCP の確認で足りる
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 240
            timeoutSeconds: 240
            failureThreshold: 1
          # 起動後に応答しなくなったら再起動する。30 秒ごとに確かめ、3 回続けて失敗したら
          # （約 90 秒応答がなければ）固まったとみなす。/api/health は async で外部に依存しないので、
          # 計算でスレッドプールが埋まっていても、DB が落ちていても応答する。
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
