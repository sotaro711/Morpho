# main へのマージで Cloud Build トリガーから実行される。
# ビルドしたイメージを service.yaml に書き込み、Cloud Run の設定ごと宣言的に反映する。
# 置換変数（_AR_HOSTNAME など）と、ビルドに埋め込む公開値（_NEXT_PUBLIC_*）はトリガー側で定義している。
steps:
  # Cloud Build は毎回まっさらな環境なので、ビルドキャッシュをレジストリの :buildcache に置いて持ち越す。
  # mode=max で中間ステージ（S4 をビルドする backend-build など）も保存する。最終イメージを
  # --cache-from に渡すだけでは、最終イメージに残らない中間ステージは毎回作り直しになる。
  # キャッシュの書き出しには docker-container ドライバのビルダーが要る。このドライバはイメージを
  # ローカルの docker に読み込まないので、--push でビルドと同時にレジストリへ送る。
  - id: Build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker buildx create --name builder --driver docker-container --use
        docker buildx build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL} \
          --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY} \
          --cache-from type=registry,ref=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:buildcache \
          --cache-to type=registry,ref=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:buildcache,mode=max \
          -t $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA \
          -t $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:latest \
          --push \
          -f Dockerfile .

  # service.yaml の image: IMAGE を今回のイメージに置き換えて反映する。
  # services update --image と違い、probe などの設定もこのファイルの内容に揃う。
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        sed "s|image: IMAGE|image: $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA|" \
          service.yaml > /workspace/service.deploy.yaml
        gcloud run services replace /workspace/service.deploy.yaml --region=$_DEPLOY_REGION --quiet

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
